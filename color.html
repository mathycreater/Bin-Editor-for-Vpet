<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Color Editor 32x16</title>
<style>
  :root {
    --bg-color: #0f111a;
    --card-bg: #1a1d2e;
    --accent-color: #00f2ff;
    --text-color: #e6edf3;
    --button-bg: #2d334a;
    --button-hover: #3d4465;
    --input-bg: #0d1117;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color); 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    margin: 0;
  }

  .container {
    background: var(--card-bg);
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-width: 900px;
    width: 100%;
  }

  h2 { margin-top: 0; color: var(--accent-color); font-weight: 300; letter-spacing: 2px; text-align: center; }

  .nav-link {
    display: block;
    text-align: center;
    margin-bottom: 20px;
    color: var(--accent-color);
    text-decoration: none;
    font-size: 14px;
  }
  .nav-link:hover { text-decoration: underline; }

  .editor-layout {
    display: flex;
    gap: 30px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .canvas-container {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border: 2px solid #333;
    border-radius: 4px;
    overflow: hidden;
    width: fit-content;
    height: fit-content;
  }

  canvas { 
    display: block;
    image-rendering: pixelated; 
    cursor: crosshair; 
    background: transparent;
  }
  
  .canvas-bg {
    background: repeating-conic-gradient(#555 0% 25%, #333 0% 50%) 50% / 20px 20px;
  }

  .status-bar {
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    color: var(--accent-color);
    font-family: monospace;
    font-size: 12px;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid #333;
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 250px;
  }

  .palette-container {
    background: var(--input-bg);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #333;
  }

  .palette-container h3 {
    margin: 0 0 10px 0;
    font-size: 14px;
    color: #8b949e;
    text-transform: uppercase;
  }

  .palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }

  .color-swatch {
    width: 100%;
    aspect-ratio: 1;
    border: 1px solid #444;
    cursor: pointer;
    border-radius: 3px;
    box-sizing: border-box;
    position: relative;
  }

  .color-swatch.selected {
    border: 2px solid white;
    z-index: 2;
    transform: scale(1.15);
    box-shadow: 0 0 5px rgba(0,0,0,0.8);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .config-panel {
    background: var(--input-bg);
    padding: 15px;
    border-radius: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    border: 1px solid #333;
  }

  .config-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    flex: 1;
    min-width: 100px;
  }

  .config-group label {
    font-size: 11px;
    color: #8b949e;
    text-transform: uppercase;
    font-weight: bold;
  }

  select, button, input[type="color"] {
    background: var(--button-bg);
    color: white;
    border: 1px solid #444;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    width: 100%;
    box-sizing: border-box;
  }
  
  input[type="color"] {
    padding: 0;
    height: 35px;
  }

  button:hover { background: var(--button-hover); border-color: var(--accent-color); }
  button.active { background: var(--accent-color); color: black; border-color: var(--accent-color); }
  button.action-btn { width: auto; }

  textarea { 
    width: 100%; 
    height: 120px; 
    background: var(--input-bg); 
    color: #58a6ff; 
    font-family: 'Cascadia Code', 'Fira Code', monospace; 
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px;
    box-sizing: border-box;
    resize: vertical;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>COLOR EDITOR 32x16</h2>
  <a href="index.html" class="nav-link">&larr; Switch to Binary Mode</a>

  <div class="editor-layout">
    <div class="canvas-container canvas-bg">
      <canvas id="canvas"></canvas>
      <div class="status-bar">
        <span id="coords">X: 0 | Y: 0</span>
        <span id="mirror-status">Mirror: OFF</span>
      </div>
    </div>

    <div class="side-panel">
      <div class="palette-container">
        <h3>Palette (32 Colors)</h3>
        <div class="palette" id="palette"></div>
        <div class="config-group" style="margin-top: 10px;">
          <label>Edit Selected Color</label>
          <input type="color" id="color-picker" value="#000000">
        </div>
      </div>

      <div class="controls">
        <button onclick="setTool('pencil')" id="btn-pencil" class="active">Pencil</button>
        <button onclick="setTool('eraser')" id="btn-eraser">Eraser</button>
        <button onclick="setTool('fill')" id="btn-fill">Fill</button>
        <button onclick="setTool('fill-eraser')" id="btn-fill-eraser">Eraser Fill</button>
      </div>

      <div class="controls">
        <button onclick="toggleMirror()" id="mirrorBtn">Mirror: OFF</button>
        <button onclick="undo()">Undo</button>
        <button onclick="redo()">Redo</button>
        <button onclick="clearGrid()">Clear</button>
      </div>
    </div>
  </div>

  <div class="config-panel" style="margin-top: 20px;">
    <div class="config-group">
      <label>Export Format</label>
      <select id="export-format">
        <option value="uint32">32-bit ARGB (0xAARRGGBB)</option>
        <option value="uint16">RGB565 (uint16_t) 0xRRRRGGGGBBBBB</option>
        <option value="rgb24">24-bit RGB (0xRRGGBB)</option>
        <option value="indices" selected>Palette Indices (uint8_t)</option>
        <option value="packed">Packed 2-bit (uint8_t[128])</option>
      </select>
    </div>
    <div class="config-group">
      <label>Include Palette Array?</label>
      <select id="export-palette">
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    <div class="config-group" style="flex: 2; display: flex; flex-direction: row; align-items: flex-end; gap: 10px;">
      <button onclick="exportData()" style="background: #238636;">Export Embedded Code</button>
      <button onclick="importData()" style="background: #1f6feb;">Import Embedded Code</button>
      <button onclick="importBinary()" style="background: #d73a49;">Import Binary Mask</button>
    </div>
  </div>

  <textarea id="output" placeholder="Embedded code (C array) output/input here..."></textarea>
</div>

<script>
const cols = 32;
const rows = 16;
const pixelSize = 15;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = cols * pixelSize;
canvas.height = rows * pixelSize;

// Default 32-color palette (Pico-8 inspired + extras)
let palette = [
  "#000000", "#1D2B53", "#7E2553", "#008751", "#AB5236", "#5F574F", "#C2C3C7", "#FFF1E8",
  "#FF004D", "#FFA300", "#FFEC27", "#00E436", "#29ADFF", "#83769C", "#FF77A8", "#FFCCAA",
  "#291814", "#111D35", "#422136", "#125359", "#742F29", "#493C2B", "#A28879", "#F3EF7D",
  "#BE1250", "#FF6C24", "#A8E72E", "#00B543", "#065AB5", "#754665", "#FF6E59", "#FF9D81"
];

let selectedColorIdx = 1; // start with color 1
let grid = createEmptyGrid();
let tool = 'pencil';
let mirror = false;
let history = [];
let redoStack = [];

function createEmptyGrid() {
  return Array.from({ length: rows }, () => Array(cols).fill(-1)); // -1 means empty/transparent
}

// Initialize palette UI
const paletteContainer = document.getElementById("palette");
const colorPicker = document.getElementById("color-picker");

function renderPalette() {
  paletteContainer.innerHTML = '';
  palette.forEach((color, idx) => {
    const swatch = document.createElement("div");
    swatch.className = "color-swatch" + (idx === selectedColorIdx ? " selected" : "");
    swatch.style.backgroundColor = color;
    swatch.onclick = () => selectColor(idx);
    paletteContainer.appendChild(swatch);
  });
}

function selectColor(idx) {
  selectedColorIdx = idx;
  renderPalette();
  colorPicker.value = palette[idx];
}

colorPicker.addEventListener('input', (e) => {
  palette[selectedColorIdx] = e.target.value;
  renderPalette();
  draw(); // redraw canvas with updated palette
});

renderPalette();
selectColor(1);

function saveState() {
  history.push(JSON.stringify(grid));
  if (history.length > 100) history.shift();
  redoStack = [];
}

function undo() {
  if (!history.length) return;
  redoStack.push(JSON.stringify(grid));
  grid = JSON.parse(history.pop());
  draw();
}

function redo() {
  if (!redoStack.length) return;
  history.push(JSON.stringify(grid));
  grid = JSON.parse(redoStack.pop());
  draw();
}

function setTool(t) {
  tool = t;
  document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
  const btn = document.getElementById(`btn-${t}`);
  if (btn) btn.classList.add('active');
}

function toggleMirror() {
  mirror = !mirror;
  document.getElementById("mirrorBtn").innerText = `Mirror: ${mirror ? "ON" : "OFF"}`;
  document.getElementById("mirror-status").innerText = `Mirror: ${mirror ? "ON" : "OFF"}`;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let colorIdx = grid[y][x];
      if (colorIdx !== -1) {
        ctx.fillStyle = palette[colorIdx];
        ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
      }
      ctx.strokeStyle = "rgba(255,255,255,0.05)";
      ctx.strokeRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
    }
  }
}

let isDrawing = false;

canvas.addEventListener("mousedown", (e) => {
  e.preventDefault();
  saveState();
  if (tool === 'fill' || tool === 'fill-eraser') {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / (rect.width / cols));
    const y = Math.floor((e.clientY - rect.top) / (rect.height / rows));
    const replaceColor = tool === 'fill' ? selectedColorIdx : -1;
    fill(x, y, grid[y][x], replaceColor);
    draw();
  } else {
    isDrawing = true;
    drawPixel(e);
  }
});

window.addEventListener("mouseup", () => { isDrawing = false; });
canvas.addEventListener("mouseleave", () => { isDrawing = false; });

canvas.addEventListener("mousemove", (e) => {
  updateCoords(e);
  if (isDrawing) drawPixel(e);
});

function updateCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / (rect.width / cols));
  const y = Math.floor((e.clientY - rect.top) / (rect.height / rows));
  
  if (x >= 0 && x < cols && y >= 0 && y < rows) {
    document.getElementById("coords").innerText = `X: ${x} | Y: ${y}`;
  }
}

function drawPixel(e) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / (rect.width / cols));
  const y = Math.floor((e.clientY - rect.top) / (rect.height / rows));

  if (x < 0 || x >= cols || y < 0 || y >= rows) return;

  const value = tool === 'eraser' ? -1 : selectedColorIdx;
  grid[y][x] = value;

  if (mirror) {
    const mx = cols - 1 - x;
    grid[y][mx] = value;
  }

  draw();
}

function fill(x, y, targetColor, replaceColor) {
  if (targetColor === replaceColor) return;
  if (x < 0 || x >= cols || y < 0 || y >= rows) return;
  if (grid[y][x] !== targetColor) return;

  let stack = [[x, y]];
  while (stack.length > 0) {
    let [cx, cy] = stack.pop();
    if (grid[cy][cx] === targetColor) {
      grid[cy][cx] = replaceColor;
      if (mirror) grid[cy][cols - 1 - cx] = replaceColor;
      if (cx > 0) stack.push([cx - 1, cy]);
      if (cx < cols - 1) stack.push([cx + 1, cy]);
      if (cy > 0) stack.push([cx, cy - 1]);
      if (cy < rows - 1) stack.push([cx, cy + 1]);
    }
  }
}

function hexToRgb(hex) {
  let r = 0, g = 0, b = 0;
  if (hex.length === 7) {
    r = parseInt(hex.substring(1, 3), 16);
    g = parseInt(hex.substring(3, 5), 16);
    b = parseInt(hex.substring(5, 7), 16);
  }
  return {r, g, b};
}

function hexToRGB565(hex) {
  let {r, g, b} = hexToRgb(hex);
  return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
}

function rgb565ToHex(val565) {
  let r = ((val565 >> 11) & 0x1F) << 3;
  let g = ((val565 >> 5) & 0x3F) << 2;
  let b = (val565 & 0x1F) << 3;
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
}

function exportData() {
  const format = document.getElementById("export-format").value;
  const includePalette = document.getElementById("export-palette").value === 'yes';
  let output = "";

  // 1. Identify used colors and create remapping
  let usedIndices = new Set();
  usedIndices.add(-1); // Always include transparent/bg as first entry (maps to 0)
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x] !== -1) usedIndices.add(grid[y][x]);
    }
  }
  
  // Convert Set to array and maintain original palette order
  let sortedUsed = Array.from(usedIndices).sort((a, b) => a - b);
  
  // Create mapping: Original Index -> New Compact Index
  let mapping = new Map();
  sortedUsed.forEach((origIdx, newIdx) => {
    mapping.set(origIdx, newIdx);
  });

  const palSize = sortedUsed.length;

  if (includePalette) {
    output += `const uint16_t palette[${palSize}] = {\n  `;
    const palVals = sortedUsed.map(origIdx => {
      let hex = (origIdx === -1) ? "#000000" : palette[origIdx];
      const c565 = hexToRGB565(hex);
      return `0x${c565.toString(16).toUpperCase().padStart(4, '0')}`;
    });
    for (let i = 0; i < palVals.length; i += 8) {
      output += palVals.slice(i, i + 8).join(', ') + (i + 8 < palVals.length ? ',\n  ' : '');
    }
    output += `\n};\n\n`;
  }

  if (format === 'indices') {
    output += `const uint8_t spriteData[${rows * cols}] = {\n`;
    const vals = [];
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let origIdx = grid[y][x];
        let newIdx = mapping.get(origIdx);
        vals.push(newIdx.toString());
      }
    }
    for (let i = 0; i < vals.length; i += 16) {
      output += '  ' + vals.slice(i, i + 16).join(', ') + (i + 16 < vals.length ? ',\n' : '\n');
    }
    output += `};\n`;
  } else if (format === 'packed') {
    const totalPixels = rows * cols; 
    const packedBytes = totalPixels / 4; 
    output += `const uint8_t spritePacked[${packedBytes}] = {\n`;
    const packed = [];
    let byteVal = 0;
    let count = 0;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let origIdx = grid[y][x];
        let val = mapping.get(origIdx) % 4; // Map to 2 bits
        byteVal = (byteVal << 2) | val;
        count++;
        if (count === 4) {
          packed.push(`0x${byteVal.toString(16).toUpperCase().padStart(2, '0')}`);
          count = 0;
          byteVal = 0;
        }
      }
    }
    for (let i = 0; i < packed.length; i += 12) {
      output += '  ' + packed.slice(i, i + 12).join(', ') + (i + 12 < packed.length ? ',\n' : '\n');
    }
    output += `};\n`;
  } else {
    const type = (format === 'uint16') ? 'uint16_t' : 'uint32_t';
    output += `const ${type} spriteData[${rows * cols}] = {\n`;
    const vals = [];
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let idx = grid[y][x];
        let hex = idx === -1 ? "#000000" : palette[idx];
        if (format === 'uint16') {
          let c565 = hexToRGB565(hex);
          vals.push(`0x${c565.toString(16).toUpperCase().padStart(4, '0')}`);
        } else if (format === 'rgb24') {
          vals.push(`0x${hex.substring(1).toUpperCase()}`);
        } else {
          vals.push(`0xFF${hex.substring(1).toUpperCase()}`);
        }
      }
    }
    for (let i = 0; i < vals.length; i += 12) {
      output += '  ' + vals.slice(i, i + 12).join(', ') + (i + 12 < vals.length ? ',\n' : '\n');
    }
    output += `};\n`;
  }

  document.getElementById("output").value = output;
}

function importData() {
  const text = document.getElementById("output").value;
  saveState();

  // Try to extract palette
  const palMatch = text.match(/palette\s*\[\s*(\d+)\s*\]\s*=\s*{([^}]+)}/i);
  if (palMatch) {
    const size = parseInt(palMatch[1]);
    const palValues = palMatch[2].match(/0x[0-9A-Fa-f]+/g);
    if (palValues) {
      for (let i = 0; i < Math.min(size, palValues.length, 32); i++) {
        let val = parseInt(palValues[i], 16);
        if (text.includes('uint16_t')) {
           palette[i] = rgb565ToHex(val);
        } else {
           let hexStr = palValues[i].replace('0x', '');
           if (hexStr.length >= 6) {
             palette[i] = '#' + hexStr.slice(-6);
           }
        }
      }
      renderPalette();
    }
  }

  // Try to extract packed data first
  const packedMatch = text.match(/spritePacked\s*\[\s*\d+\s*\]\s*=\s*{([^}]+)}/i);
  if (packedMatch) {
    const packedVals = packedMatch[1].match(/0x[0-9A-Fa-f]+/g);
    if (packedVals) {
      grid = createEmptyGrid();
      let idx = 0;
      for (let i = 0; i < packedVals.length; i++) {
        let byteVal = parseInt(packedVals[i], 16);
        for (let bit = 3; bit >= 0; bit--) {
          let val = (byteVal >> (bit * 2)) & 0x03;
          let y = Math.floor(idx / cols);
          let x = idx % cols;
          if (idx < rows * cols) grid[y][x] = val;
          idx++;
        }
      }
      draw();
      return;
    }
  }

  // Try to extract sprite data
  const dataMatch = text.match(/spriteData\s*\[\s*\d+\s*\]\s*=\s*{([^}]+)}/i) || text.match(/{\s*([^}]+)}/i);
  if (dataMatch) {
    const values = dataMatch[1].match(/0x[0-9A-Fa-f]+|\b\d+\b/g);
    if (values) {
      grid = createEmptyGrid();
      for (let i = 0; i < Math.min(values.length, rows * cols); i++) {
        let y = Math.floor(i / cols);
        let x = i % cols;
        let valStr = values[i];
        let val = parseInt(valStr, valStr.startsWith('0x') ? 16 : 10);
        
        if (val < 32 && !valStr.startsWith('0x')) {
          grid[y][x] = val;
        } else if (text.includes('uint16_t')) {
          grid[y][x] = findClosestColorInPalette16(val);
        } else {
          grid[y][x] = findClosestColorInPalette32(val);
        }
      }
      draw();
      return;
    }
  }
  alert("Could not parse valid array format from input.");
}

// New: Import a binary mask (multiple lines of 0/1)
function importBinary() {
  const text = document.getElementById("output").value.trim();
  if (!text) return alert("No binary data found.");
  const lines = text.split(/\r?\n/).filter(l => l.length > 0);
  saveState();
  for (let y = 0; y < Math.min(rows, lines.length); y++) {
    const line = lines[y].trim();
    for (let x = 0; x < Math.min(cols, line.length); x++) {
      if (line[x] === '1') {
        grid[y][x] = selectedColorIdx;
        if (mirror) grid[y][cols - 1 - x] = selectedColorIdx;
      }
    }
  }
  draw();
}

function findClosestColorInPalette16(val565) {
  let r1 = ((val565 >> 11) & 0x1F) << 3;
  let g1 = ((val565 >> 5) & 0x3F) << 2;
  let b1 = (val565 & 0x1F) << 3;
  return findClosest(r1, g1, b1);
}

function findClosestColorInPalette32(val) {
  let hex = val.toString(16).padStart(6, '0');
  let r1 = parseInt(hex.slice(-6, -4), 16) || 0;
  let g1 = parseInt(hex.slice(-4, -2), 16) || 0;
  let b1 = parseInt(hex.slice(-2), 16) || 0;
  return findClosest(r1, g1, b1);
}

function findClosest(r1, g1, b1) {
  if (r1 === 0 && g1 === 0 && b1 === 0) return -1; // Assuming 0 is transparent/empty or index 0
  let minDist = Infinity;
  let minIdx = 0;
  for (let i = 0; i < 32; i++) {
    let {r, g, b} = hexToRgb(palette[i]);
    let dist = (r-r1)*(r-r1) + (g-g1)*(g-g1) + (b-b1)*(b-b1);
    if (dist < minDist) {
      minDist = dist;
      minIdx = i;
    }
  }
  return minIdx;
}

function clearGrid() {
  saveState();
  grid = createEmptyGrid();
  draw();
}

try { draw(); } catch (e) { console.error("Draw failed", e); }
</script>

</body>
</html>
